version: '3'
services:
  smart-home-pc:
    build:
      context: ./SmartHomePCControl-Rust
      dockerfile: Dockerfile
    network_mode: host
    container_name: smart-home-pc
    restart: unless-stopped
    environment:
      - DEVICE_MAC=${DEVICE_MAC:-00:11:22:33:44:55}
      - SERVER_IP=${SERVER_IP:-192.168.1.100}
      - HOME_API_KEY=${HOME_API_KEY:-}

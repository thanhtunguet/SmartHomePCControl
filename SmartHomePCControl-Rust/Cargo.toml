[package]
name = "smarthome-pc-controller"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.42", features = ["macros", "rt", "net", "time"] }
axum = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
